name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1. Install it into a directory of
      # our own and put that first on PATH, so the upgrade cannot be shadowed by
      # the npm that ships with Node.
      - name: Install npm 11 for trusted publishing
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm11" npm@^11
          echo "$RUNNER_TEMP/npm11/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain
        run: |
          echo "npm: $(npm --version)"
          echo "node: $(node --version)"
          echo "which npm: $(command -v npm)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC id-token endpoint: available"
          else
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is missing; trusted publishing cannot work"
            exit 1
          fi

      - name: Use the public registry
        run: npm config set registry https://registry.npmjs.org

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Inspect the tarball
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential and attaches provenance automatically.
      - name: Publish
        run: npm publish --access public
